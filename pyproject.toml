[project]
name = "attendance-crmt"
version = "0.1.0"
description = "A modular FastMCP server scaffold."
authors = [
    { name = "Jose Luis Cambil", email = "joseluiscc103@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10,<3",
    "pyodbc>=5.2",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "uvicorn>=0.41",
]

[project.scripts]
attendance-crmt = "attendance_crmt:main"
attendance-crmt-check-active-emails = "attendance_crmt.readiness:main"
attendance-crmt-verify-deployment = "attendance_crmt.deployment_verification:main"
attendance-crmt-verify-audit = "attendance_crmt.deployment_verification:audit_main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
